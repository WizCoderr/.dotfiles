version: "3.8"

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    ports:
      - "8080:8080"
    environment:
      # --- Ollama ---
      OLLAMA_API_BASE_URL: "http://192168.1.15:11434"

      # --- OpenAI ---
      OPENAI_API_KEY: "lm-studio"
      OPENAI_API_BASE_URL: "http://192.168.1.15:1234/v1"

      # --- Optional ---
      ENABLE_AUTO_UPDATE: "true"
      AUTO_UPDATE_INTERVAL: "3600"
    volumes:
      - openwebui_data:/app/backend/data
    restart: always

volumes:
  openwebui_data:
